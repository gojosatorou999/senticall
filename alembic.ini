## Alembic config for fg-voice.
##
## `sqlalchemy.url` is intentionally blank — the real URL comes from
## `Settings.database_url` (see alembic/env.py) so dev, staging, and
## prod use the same code path with different env vars.

[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
