name: ci

on:
  push:
    branches: [main]
    paths:
      - "ai-calling-agent/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "ai-calling-agent/**"
      - ".github/workflows/ci.yml"

# Cancel in-progress runs on the same ref to save minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ai-calling-agent

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.5.13"

jobs:
  lint-and-test:
    name: lint + type + unit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "ai-calling-agent/uv.lock"

      - name: install python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: sync deps
        run: uv sync --all-extras

      - name: ruff (lint)
        run: uv run ruff check .

      - name: ruff (format)
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy src

      - name: import-linter contracts
        run: uv run lint-imports

      - name: pytest (unit + property)
        run: uv run pytest tests/unit tests/property -m "not slow" --cov --cov-report=xml

      - name: pip-audit (dependency vulnerabilities)
        run: uv run pip-audit --strict --skip-editable

  docker-build:
    name: docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [agent, api, flows]
    steps:
      - uses: actions/checkout@v4

      - name: docker buildx
        uses: docker/setup-buildx-action@v3

      - name: build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ai-calling-agent
          file: ai-calling-agent/docker/Dockerfile.${{ matrix.image }}
          push: false
          tags: fg-voice-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
