name: deploy

# Triggered manually (workflow_dispatch) or automatically on a pushed tag
# that matches a semver pattern (v1.2.3 → staging; v1.2.3-prod → prod).
# CI must pass on the same SHA before this workflow runs — enforced by
# the `needs: ci` gate when triggered via the `push` event.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [staging, prod]
      image_tag:
        description: "Image tag (leave blank to use the commit SHA)"
        required: false
        default: ""

  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"         # → staging
      - "v[0-9]+.[0-9]+.[0-9]+-prod"    # → prod
    paths:
      - "ai-calling-agent/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # never cancel a deploy in progress

defaults:
  run:
    working-directory: ai-calling-agent

env:
  AWS_REGION: ap-south-1
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.5.13"

jobs:
  # ── Resolve environment and image tag ─────────────────────────────
  config:
    name: resolve config
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      image_tag:   ${{ steps.env.outputs.image_tag }}
    steps:
      - id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
            TAG="${{ github.event.inputs.image_tag }}"
            TAG="${TAG:-${{ github.sha }}}"
          elif [[ "${{ github.ref }}" == *"-prod" ]]; then
            ENV="prod"
            TAG="${{ github.sha }}"
          else
            ENV="staging"
            TAG="${{ github.sha }}"
          fi
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "image_tag=$TAG"   >> "$GITHUB_OUTPUT"

  # ── Build + push images to ECR ───────────────────────────────────
  build:
    name: build + push (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: config
    environment: ${{ needs.config.outputs.environment }}
    strategy:
      fail-fast: true
      matrix:
        image: [agent, api, flows]

    permissions:
      id-token: write   # OIDC
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: docker buildx
        uses: docker/setup-buildx-action@v3

      - name: build + push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ai-calling-agent
          file: ai-calling-agent/docker/Dockerfile.${{ matrix.image }}
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/fg-voice-${{ matrix.image }}:${{ needs.config.outputs.image_tag }}
            ${{ steps.ecr.outputs.registry }}/fg-voice-${{ matrix.image }}:latest-${{ needs.config.outputs.environment }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ needs.config.outputs.environment }}
          cache-to:   type=gha,mode=max,scope=${{ matrix.image }}-${{ needs.config.outputs.environment }}
          build-args: |
            FG_AGENT_VERSION=${{ needs.config.outputs.image_tag }}

  # ── Deploy via Terraform ─────────────────────────────────────────
  deploy:
    name: terraform apply (${{ needs.config.outputs.environment }})
    runs-on: ubuntu-latest
    needs: [config, build]
    environment: ${{ needs.config.outputs.environment }}

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: setup terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"

      - name: terraform init
        working-directory: ai-calling-agent/infra/terraform
        run: |
          terraform init \
            -backend-config="key=envs/${{ needs.config.outputs.environment }}/terraform.tfstate"

      - name: terraform plan
        id: plan
        working-directory: ai-calling-agent/infra/terraform
        run: |
          terraform plan \
            -var-file="envs/${{ needs.config.outputs.environment }}.tfvars" \
            -var="image_tag=${{ needs.config.outputs.image_tag }}" \
            -out=tfplan \
            -detailed-exitcode
        continue-on-error: true

      - name: apply (no-change fast-path)
        if: steps.plan.outputs.exitcode == '0'
        run: echo "No infrastructure changes — skipping apply"

      - name: terraform apply
        if: steps.plan.outputs.exitcode == '2'
        working-directory: ai-calling-agent/infra/terraform
        run: terraform apply -auto-approve tfplan

      - name: fail on plan error
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

  # ── Wait for service stability + health check ────────────────────
  verify:
    name: verify rollout
    runs-on: ubuntu-latest
    needs: [config, deploy]
    environment: ${{ needs.config.outputs.environment }}

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: wait for fg-voice-agent to stabilise
        run: |
          CLUSTER="fg-voice-${{ needs.config.outputs.environment }}"
          SERVICE="${CLUSTER}-agent"
          echo "Waiting for service $SERVICE in cluster $CLUSTER..."
          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services "$SERVICE"
          echo "fg-voice-agent is stable."

      - name: wait for fg-voice-api to stabilise
        run: |
          CLUSTER="fg-voice-${{ needs.config.outputs.environment }}"
          SERVICE="${CLUSTER}-api"
          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services "$SERVICE"
          echo "fg-voice-api is stable."

      - name: healthz smoke test
        run: |
          DOMAIN="${{ secrets.VOICE_DOMAIN }}"
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "https://${DOMAIN}/healthz" || echo "000")
          if [[ "$STATUS" != "200" ]]; then
            echo "Healthz returned $STATUS — rolling back"
            exit 1
          fi
          echo "Healthz OK (200)"

      - name: readyz smoke test
        run: |
          DOMAIN="${{ secrets.VOICE_DOMAIN }}"
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "https://${DOMAIN}/readyz" || echo "000")
          # 200 = healthy; 503 is acceptable (degraded but running)
          if [[ "$STATUS" != "200" && "$STATUS" != "503" ]]; then
            echo "Readyz returned $STATUS — rolling back"
            exit 1
          fi
          echo "Readyz returned $STATUS"

  # ── Rollback on verify failure ───────────────────────────────────
  rollback:
    name: rollback on failure
    runs-on: ubuntu-latest
    needs: [config, deploy, verify]
    if: failure() && needs.deploy.result == 'success'
    environment: ${{ needs.config.outputs.environment }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: roll back agent service to previous task definition
        run: |
          CLUSTER="fg-voice-${{ needs.config.outputs.environment }}"
          SERVICE="${CLUSTER}-agent"
          # Describe the current service to get the running task def ARN,
          # then walk back one revision.
          CURRENT=$(aws ecs describe-services \
            --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          FAMILY=$(echo "$CURRENT" | cut -d: -f6 | rev | cut -d: -f2- | rev)
          PREV_REVISION=$(( $(echo "$CURRENT" | rev | cut -d: -f1 | rev) - 1 ))
          PREV="${FAMILY}:${PREV_REVISION}"
          echo "Rolling back $SERVICE from $CURRENT → $PREV"
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --task-definition "$PREV"
          aws ecs wait services-stable \
            --cluster "$CLUSTER" --services "$SERVICE"
          echo "Rollback complete."

      - name: annotate failure
        if: always()
        run: |
          echo "::error::Deploy to ${{ needs.config.outputs.environment }} failed. Rollback attempted."
