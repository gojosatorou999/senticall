[project]
name = "fg-voice"
version = "0.1.0"
description = "Sentinel Voice Agent — coastal hazard reporting over Twilio."
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Team Sentinel" }]

dependencies = [
    # ── Web / ASGI ────────────────────────────────────────────
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "websockets>=13",
    "python-multipart>=0.0.20",   # FastAPI Form(...) parsing on /voice/*
    # ── Config / validation ───────────────────────────────────
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    # ── Data / persistence ────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis[hiredis]>=5.2",
    # ── AWS ───────────────────────────────────────────────────
    "boto3>=1.35",
    "aioboto3>=13.2",
    # ── Telephony ─────────────────────────────────────────────
    "twilio>=9.3",
    # ── Audio / numeric ───────────────────────────────────────
    "numpy>=1.26,<2.2",
    "scipy>=1.14",
    "audioop-lts>=0.2.1; python_version >= '3.13'",
    # ── Observability ─────────────────────────────────────────
    "structlog>=24.4",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
# Heavy ML / RAG deps — only needed once P3/P4 land. Kept optional so the
# base image stays small and P0/P1/P2 CI runs fast.
rag = [
    "faiss-cpu>=1.9",
    "sentence-transformers>=3.3",
    "rapidfuzz>=3.10",
    "metaphone>=0.6",
    "pgvector>=0.3",
]
llm = [
    # Anthropic SDK — used by `enrichment/extractors/claude_llm.py`.
    # Pinned at the version that ships Opus 4.7 + `messages.parse()`.
    "anthropic>=0.60",
]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "hypothesis>=6.119",
    "import-linter>=2.1",
    "pip-audit>=2.7",
    "types-pyyaml>=6.0",
    "types-redis>=4.6",
    # Async SQLite driver — used by tests so persistence covers can run
    # without a real Postgres. Production uses asyncpg per config.py.
    "aiosqlite>=0.20",
    # Anthropic SDK for ClaudeExtractor tests — even though the SDK is
    # optional at runtime (via the `[llm]` extras), the test suite mocks
    # against it and needs it importable. Kept in dev-deps so a plain
    # `uv sync` for CI runs a full test pass.
    "anthropic>=0.60",
    # rapidfuzz for JsonGazetteerGeocoder tests. Same reasoning as
    # anthropic above — the runtime dep is optional (via `[rag]` extras),
    # but the tests need the real matcher rather than a mock so we
    # exercise the actual fuzzy-matching behaviour.
    "rapidfuzz>=3.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fg_voice"]

# ─────────────────────────────────────────────────────────────────
#  Ruff
# ─────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "ASYNC",         # async pitfalls (blocking calls in the audio path)
    "S",             # bandit-lite
]
ignore = [
    "E501",   # line length handled by formatter
    "S101",   # asserts are fine in tests
    "B008",   # FastAPI Depends() in default args
]

[tool.ruff.lint.per-file-ignores]
# tests: security rules and async pitfalls don't apply, E402 is expected
# after sys.path manipulation in test helpers, E731 lambdas are fine in tests
"tests/**" = ["S", "ASYNC", "E402", "E731", "B905"]
# scripts: security rules don't apply (CLI tools), E402 is expected after
# sys.path manipulation, E731 lambdas and SIM117 nested-with are acceptable
"scripts/**" = ["S", "E402", "E731", "B905", "SIM117", "S110"]
# alembic: import order is generated by alembic tooling
"alembic/**" = ["I001", "E402"]

# ─────────────────────────────────────────────────────────────────
#  MyPy — strict on the deterministic core (conversation/, extraction/)
# ─────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fg_voice.conversation.*", "fg_voice.extraction.*"]
strict = true
disallow_untyped_defs = true
disallow_any_generics = true

# Third-party packages without type stubs. Extend when you add a new dep
# that ships no py.typed marker.
[[tool.mypy.overrides]]
module = [
    "faiss",
    "faiss.*",
    "sentence_transformers",
    "sentence_transformers.*",
    "metaphone",
    "metaphone.*",
    "rapidfuzz",
    "rapidfuzz.*",
    "aioboto3",
    "aioboto3.*",
]
ignore_missing_imports = true

# ─────────────────────────────────────────────────────────────────
#  Pytest
# ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast in-process tests",
    "property: hypothesis-driven tests",
    "golden: audio → slot regression",
    "noise: SNR sweep",
    "integration: requires local docker-compose",
    "load: synthetic concurrency",
    "chaos: dependency-kill tests",
    "slow: > 5s, skipped by default in CI",
]

[tool.coverage.run]
source = ["src/fg_voice"]
branch = true
omit = ["*/__init__.py"]

[dependency-groups]
scripts = [
    "dbfread>=2.0.7",
]
